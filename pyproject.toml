[project]
name = "the-chronicle"
version = "0.1.0"
description = "A living medieval dynastic simulation — The Chronicle prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
]

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
